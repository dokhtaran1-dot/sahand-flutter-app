name: Deploy Flutter Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rebuild Royal 1 page two artwork
        run: |
          python3 - <<'PY'
          import base64, pathlib, re
          root = pathlib.Path('.')
          parts = []
          for i in range(1, 13):
              text = (root / f'lib/src/page2_data_{i}.dart').read_text()
              match = re.search(r"=\s*'([^']*)';", text, re.S)
              if not match:
                  raise SystemExit(f'Could not read page2_data_{i}.dart')
              parts.append(match.group(1))
          raw = base64.b64decode(''.join(parts), validate=True)
          if not raw.startswith(b'\xff\xd8') or not raw.endswith(b'\xff\xd9'):
              raise SystemExit('Royal 1 page image is not a valid complete JPEG')
          out = root / 'assets/image/royal1_page2_final.jpg'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(raw)
          print(f'Created {out} ({len(raw)} bytes)')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/sahand-flutter-app/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
