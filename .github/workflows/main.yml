name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Install Royal 1 launcher icon
        run: |
          base64 --decode tooling/royal1_icon.b64 > /tmp/royal1_icon.png
          for dir in \
            android/app/src/main/res/mipmap-mdpi \
            android/app/src/main/res/mipmap-hdpi \
            android/app/src/main/res/mipmap-xhdpi \
            android/app/src/main/res/mipmap-xxhdpi \
            android/app/src/main/res/mipmap-xxxhdpi; do
            cp /tmp/royal1_icon.png "$dir/ic_launcher.png"
          done

      - name: Verify active artwork
        run: |
          test -s assets/image/Home.png
          test -s assets/image/Rv_page2.png
          test -s assets/image/Rc_page2.png
          test -s assets/image/deal_case.png
          test -s assets/image/deal_banker.png
          test -s assets/image/deal_jackpot.png
          test -s assets/image/rv_lounge_imperial_classique.png
          test -s assets/image/salon_jardin.png
          test -s assets/image/salon_lumiere.png
          test -s assets/image/salon_dore.png
          test -s assets/image/salon_royal.png
          test -s assets/image/salon_prive.png
          test -s assets/image/salon_noir.png
          test -s assets/image/salon_ame_du_poete.png
          test -s assets/image/screen_01.png
          test -s assets/image/screen_02.png
          test -s assets/image/screen_03.png
          test -s assets/image/screen_04.png
          test -s assets/image/screen_05.png

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --build-name 1.0.9 --build-number 11

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: royal1-v1.0.9-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
