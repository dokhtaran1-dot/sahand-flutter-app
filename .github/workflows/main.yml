name: Build ROYAL1 Android + Web

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: royal1-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Install Royal 1 launcher icon
        run: |
          base64 --decode tooling/royal1_icon.b64 > /tmp/royal1_icon.png
          for dir in \
            android/app/src/main/res/mipmap-mdpi \
            android/app/src/main/res/mipmap-hdpi \
            android/app/src/main/res/mipmap-xhdpi \
            android/app/src/main/res/mipmap-xxhdpi \
            android/app/src/main/res/mipmap-xxxhdpi; do
            cp /tmp/royal1_icon.png "$dir/ic_launcher.png"
          done

      # A previous edit removed the large original zip from the current tree.
      # Retrieve that exact checked-in version at build time, without putting
      # the deleted archive back into the user's working branch.
      - name: Restore required Royal Village salon archive
        run: |
          if [ ! -s assets/image/Royal_Village_App_Upload.zip ]; then
            git fetch --no-tags --depth=1 origin ac94557573e15519e35b3b5f7b99388bb2553bed
            git show ac94557573e15519e35b3b5f7b99388bb2553bed:assets/image/Royal_Village_App_Upload.zip > assets/image/Royal_Village_App_Upload.zip
          fi
          unzip -tq assets/image/Royal_Village_App_Upload.zip

      - name: Verify active artwork
        run: |
          test -s assets/image/Home.png
          test -s assets/image/Welcome.png
          test -s assets/image/Rv_page2.png
          test -s assets/image/Rc_page2.png
          test -s assets/image/deal_case.png
          test -s assets/image/deal_banker.png
          test -s assets/image/deal_jackpot.png
          test -s assets/image/Royal_Village_App_Upload.zip
          test -s assets/image/screen_01.png
          test -s assets/image/screen_02.png
          test -s assets/image/screen_03.png
          test -s assets/image/screen_04.png
          test -s assets/image/screen_05.png

      - name: Extract Royal Village salon package
        run: |
          rm -rf assets/image/rv_upload
          mkdir -p assets/image/rv_upload
          unzip -o assets/image/Royal_Village_App_Upload.zip -d assets/image/rv_upload
          find assets/image/rv_upload -type f | sort

      - name: Prepare dedicated salon galleries
        run: |
          if [ -s assets/image/RV_salon_galleries_ready.zip ]; then
            unzip -tq assets/image/RV_salon_galleries_ready.zip
            unzip -o assets/image/RV_salon_galleries_ready.zip -d .
          fi
          for salon in dore prive noir royal lumiere jardin ame_du_poete imperial; do
            mkdir -p "assets/image/salon_gallery/$salon"
          done

      - name: Install approved booking posters
        run: |
          if [ -s assets/image/RV_8_final_imperial_ultra.zip ]; then
            unzip -tq assets/image/RV_8_final_imperial_ultra.zip
            unzip -o assets/image/RV_8_final_imperial_ultra.zip -d .
          fi
          test -s assets/image/booking_posters/dore.png
          test -s assets/image/booking_posters/jardin.png
          test -s assets/image/booking_posters/noir.png
          test -s assets/image/booking_posters/ame_du_poete.png
          test -s assets/image/booking_posters/royal.png
          test -s assets/image/booking_posters/imperial.png
          test -s assets/image/booking_posters/prive.png
          test -s assets/image/booking_posters/lumiere.png

      - name: Get packages
        run: flutter pub get

      - name: Configure Royal Club membership
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'ROYAL_CLUB_DART_DEFINES=--dart-define=SUPABASE_URL=%s --dart-define=SUPABASE_ANON_KEY=%s --dart-define=ROYAL_CLUB_BACKEND_READY=true\\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" >> "$GITHUB_ENV"
          else
            echo 'ROYAL_CLUB_DART_DEFINES=' >> "$GITHUB_ENV"
            echo 'Membership remains disabled until backend is configured.'
          fi

      - name: Build APK
        run: flutter build apk --debug --build-name 1.0.14 --build-number 16 $ROYAL_CLUB_DART_DEFINES

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: royal1-v1.0.14-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Build Web
        run: flutter build web --release --base-href /sahand-flutter-app/ $ROYAL_CLUB_DART_DEFINES

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Web
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy Web
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
