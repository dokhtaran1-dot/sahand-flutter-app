name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix-entry-home-ultra
      - royal1-final-exact-home

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Verify uploaded Royal1 home artwork
        run: |
          python3 - <<'PY'
          from PIL import Image
          path = 'assets/image/Home.png'
          im = Image.open(path)
          print(f'Using uploaded Home.png: {im.size[0]}x{im.size[1]} {im.format}')
          if im.size != (1024, 1536):
              raise SystemExit(f'Unexpected Home.png size: {im.size}')
          PY

      - name: Install Royal 1 launcher icon
        run: |
          base64 --decode tooling/royal1_icon.b64 > /tmp/royal1_icon.png
          for dir in \
            android/app/src/main/res/mipmap-mdpi \
            android/app/src/main/res/mipmap-hdpi \
            android/app/src/main/res/mipmap-xhdpi \
            android/app/src/main/res/mipmap-xxhdpi \
            android/app/src/main/res/mipmap-xxxhdpi; do
            cp /tmp/royal1_icon.png "$dir/ic_launcher.png"
          done

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --build-name 1.0.7 --build-number 9

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sahand-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
