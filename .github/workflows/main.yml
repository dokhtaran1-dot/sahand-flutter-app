name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Rebuild Royal 1 page two artwork
        run: |
          python3 - <<'PY'
          import base64, pathlib, re
          root = pathlib.Path('.')
          parts = []
          for i in range(1, 6):
              text = (root / f'lib/src/page2_data_{i}.dart').read_text()
              match = re.search(r"=\s*'([^']*)';", text, re.S)
              if not match:
                  raise SystemExit(f'Could not read page2_data_{i}.dart')
              parts.append(match.group(1))
          raw = base64.b64decode(''.join(parts), validate=True)
          if not raw.startswith(b'\xff\xd8') or not raw.endswith(b'\xff\xd9'):
              raise SystemExit('Royal 1 page image is not a valid complete JPEG')
          out = root / 'assets/image/royal1_page2_final.jpg'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(raw)
          print(f'Created {out} ({len(raw)} bytes)')
          PY
          file assets/image/royal1_page2_final.jpg

      - name: Install Royal 1 launcher icon
        run: |
          base64 --decode tooling/royal1_icon.b64 > /tmp/royal1_icon.png
          for dir in \
            android/app/src/main/res/mipmap-mdpi \
            android/app/src/main/res/mipmap-hdpi \
            android/app/src/main/res/mipmap-xhdpi \
            android/app/src/main/res/mipmap-xxhdpi \
            android/app/src/main/res/mipmap-xxxhdpi; do
            cp /tmp/royal1_icon.png "$dir/ic_launcher.png"
          done

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sahand-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
