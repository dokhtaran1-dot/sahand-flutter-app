name: Build ROYAL1 v1.0.29 Direct ARM64 APK

on:
  push:
    branches:
      - main
      - feat/royal-club-registration-v1
      - feat/royal-one-premium-rv-redesign
    paths:
      - '.github/workflows/direct-apk.yml'
      - 'android/settings.gradle.kts'
      - 'android/app/build.gradle.kts'
      - 'lib/src/home_page.dart'
      - 'lib/src/galaxy_home_page.dart'
      - 'lib/src/royal_club_game_page.dart'
      - 'lib/src/royal_games_page.dart'
      - 'lib/src/royal_wallet_page.dart'
      - 'lib/src/royal_club_membership_page.dart'
      - 'lib/src/royal_village_luxury_page.dart'
      - 'lib/src/royal_village_page.dart'
      - 'lib/src/royal_club_profile_page.dart'
      - 'lib/src/royal_club_member_service.dart'
      - 'lib/src/royal_club_explore_page.dart'
      - 'lib/src/ettehad_page.dart'
      - 'lib/src/royal_signature_page.dart'
      - 'lib/main.dart'
      - 'lib/welcome_page.dart'
      - 'assets/image/royal_one_home_classic_full.webp'
      - 'assets/image/mne_*.jpg'
      - 'pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Install Royal 1 launcher icon
        run: |
          test -s tooling/royal1_icon_round.png
          for dir in \
            android/app/src/main/res/mipmap-mdpi \
            android/app/src/main/res/mipmap-hdpi \
            android/app/src/main/res/mipmap-xhdpi \
            android/app/src/main/res/mipmap-xxhdpi \
            android/app/src/main/res/mipmap-xxxhdpi; do
            rm -f "$dir/ic_launcher.jpg" "$dir/ic_launcher.png" "$dir/ic_launcher_round.png" "$dir/ic_launcher_foreground.png"
            cp tooling/royal1_icon_round.png "$dir/ic_launcher.png"
            cp tooling/royal1_icon_round.png "$dir/ic_launcher_round.png"
            cp tooling/royal1_icon_round.png "$dir/ic_launcher_foreground.png"
          done

      - name: Restore required Royal Village salon archive
        run: |
          if [ ! -s assets/image/Royal_Village_App_Upload.zip ]; then
            git fetch --no-tags --depth=1 origin ac94557573e15519e35b3b5f7b99388bb2553bed
            git show ac94557573e15519e35b3b5f7b99388bb2553bed:assets/image/Royal_Village_App_Upload.zip > assets/image/Royal_Village_App_Upload.zip
          fi
          unzip -tq assets/image/Royal_Village_App_Upload.zip
          rm -rf assets/image/rv_upload
          mkdir -p assets/image/rv_upload
          unzip -o assets/image/Royal_Village_App_Upload.zip -d assets/image/rv_upload

      - name: Prepare salon assets
        run: |
          if [ -s assets/image/RV_salon_galleries_ready.zip ]; then unzip -o assets/image/RV_salon_galleries_ready.zip -d .; fi
          if [ -s assets/image/RV_8_final_imperial_ultra.zip ]; then unzip -o assets/image/RV_8_final_imperial_ultra.zip -d .; fi

      - name: Get packages
        run: flutter pub get

      - name: Work around app_links Android compile SDK bug
        run: |
          plugin_gradle="$HOME/.pub-cache/hosted/pub.dev/app_links-6.4.1/android/build.gradle"
          test -f "$plugin_gradle"
          sed -i 's/flutter\.compileSdkVersion/35/g; s/flutter\.minSdkVersion/23/g' "$plugin_gradle"

      - name: Isolate ARM64 preview to protect installed app data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          content = gradle.read_text()
          needle = '        release {\n'
          assert content.count(needle) == 1
          gradle.write_text(content.replace(needle, needle + '            applicationIdSuffix = ".preview29"\n'))
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          assert 'android:label="ROYAL 1"' in content
          manifest.write_text(content.replace('android:label="ROYAL 1"', 'android:label="ROYAL ONE 1.0.29"'))
          PY

      - name: Build ARM64 APK
        run: |
          flutter build apk --release --split-per-abi --build-name 1.0.29 --build-number 31 \
            --dart-define=SUPABASE_URL=https://jwddfcsikkialxzbrhle.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_VYZ6sC5mRndjvlcKijTSsQ_65nyHEve \
            --dart-define=ROYAL_CLUB_BACKEND_READY=true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/ROYAL_ONE_v1.0.29_ARM64.apk
          test -s build/app/outputs/flutter-apk/ROYAL_ONE_v1.0.29_ARM64.apk
          sha256sum build/app/outputs/flutter-apk/ROYAL_ONE_v1.0.29_ARM64.apk

      - name: Upload direct APK
        uses: actions/upload-artifact@v4
        with:
          name: ROYAL1-v1.0.29-arm64
          path: build/app/outputs/flutter-apk/ROYAL_ONE_v1.0.29_ARM64.apk
          compression-level: 0

      - name: Publish optimized APK to permanent GitHub Release
        if: github.ref == 'refs/heads/feat/royal-one-premium-rv-redesign'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag='royal-one-v1.0.29'
          apk='build/app/outputs/flutter-apk/ROYAL_ONE_v1.0.29_ARM64.apk'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title 'ROYAL ONE v1.0.29 — Android preview' \
              --notes 'ROYAL ONE v1.0.29 | Royal Club verified SMS enrollment, membership ID QR, optional private profile photos, and secure logout. No purchases, cash prizes or private rooms.' \
              --prerelease || gh release upload "$tag" "$apk" --clobber
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'
