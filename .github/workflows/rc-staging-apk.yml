name: RC offline Android APK (free)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/rc/**'
      - 'lib/main_rc_staging.dart'
      - 'lib/main_rc_offline.dart'
      - 'supabase/**'
      - 'test/rc_rules_test.dart'
      - '.github/workflows/rc-staging-apk.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: RC rules tests
        run: flutter test test/rc_rules_test.dart
      - name: Build isolated offline debug APK (no secrets needed)
        run: |
          flutter build apk --debug --target lib/main_rc_offline.dart
          cp build/app/outputs/flutter-apk/app-debug.apk royal-one-rc-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: royal-one-rc-test-apk
          path: royal-one-rc-test.apk
          retention-days: 7
